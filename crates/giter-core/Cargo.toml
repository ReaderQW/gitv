[package]
name = "giter-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Core library for giter - a git repository analysis tool"

[lib]
name = "giter_core"
path = "src/lib.rs"

[dependencies]
git2 = "0.18"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
csv = "1.3"

[dev-dependencies]
tempfile = "3.8"
