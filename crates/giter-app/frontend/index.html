<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Giter</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Top toolbar -->
  <header id="toolbar">
    <h1>Giter</h1>
    <div class="toolbar-actions">
      <button id="btn-open" class="btn primary">+ 打开仓库</button>
      <button id="btn-scan-all" class="btn">全部扫描</button>
      <button id="btn-scan-selected" class="btn">扫描选中</button>
    </div>
    <span id="status-bar">就绪</span>
  </header>

  <div id="app-layout">
    <!-- Left sidebar: repo list -->
    <aside id="sidebar">
      <h2>仓库列表</h2>
      <div id="repo-list">
        <p class="hint">尚未添加仓库。<br/>点击「打开仓库」开始。</p>
      </div>
    </aside>

    <!-- Main content area -->
    <main id="content">
      <div id="welcome">
        <h2>欢迎使用 Giter</h2>
        <p>打开一个 Git 仓库以查看分析结果。</p>
      </div>
      <div id="stats-panel" style="display:none;">
        <div id="stats-header">
          <h2 id="stats-repo-name"></h2>
          <span id="stats-state" class="badge"></span>
        </div>
        <div id="stats-grid">
          <div class="stat-card">
            <span class="stat-label">提交数</span>
            <span class="stat-value" id="stat-commits">—</span>
          </div>
          <div class="stat-card">
            <span class="stat-label">变更文件数</span>
            <span class="stat-value" id="stat-files">—</span>
          </div>
          <div class="stat-card">
            <span class="stat-label">新增行数</span>
            <span class="stat-value" id="stat-insertions">—</span>
          </div>
          <div class="stat-card">
            <span class="stat-label">删除行数</span>
            <span class="stat-value" id="stat-deletions">—</span>
          </div>
        </div>
        <div id="stats-detail">
          <!-- Tab 导航 -->
          <div id="tab-bar">
            <button class="tab active" data-panel="commits">提交记录</button>
            <button class="tab" data-panel="changes">文件变更</button>
            <button class="tab" data-panel="contributors">贡献者</button>
            <button class="tab" data-panel="languages">语言分布</button>
            <button class="tab" data-panel="trends">趋势</button>
          </div>

          <!-- 提交记录 -->
          <div class="tab-panel active" id="panel-commits">
            <table id="commits-table">
              <thead>
                <tr><th>哈希</th><th>作者</th><th>日期</th><th>提交信息</th></tr>
              </thead>
              <tbody id="commits-body"></tbody>
            </table>
          </div>

          <!-- 文件变更明细 -->
          <div class="tab-panel" id="panel-changes">
            <div class="table-wrap">
              <table>
                <thead><tr><th>文件路径</th><th>类型</th><th>新增</th><th>删除</th><th>提交哈希</th></tr></thead>
                <tbody id="changes-body"></tbody>
              </table>
            </div>
          </div>

          <!-- 贡献者统计 -->
          <div class="tab-panel" id="panel-contributors">
            <div id="contributors-list"></div>
          </div>

          <!-- 语言分布 -->
          <div class="tab-panel" id="panel-languages">
            <div id="languages-chart" class="bar-chart"></div>
          </div>

          <!-- 趋势图 -->
          <div class="tab-panel" id="panel-trends">
            <div id="trend-mode-bar">
              <button class="trend-btn active" data-mode="day">按天</button>
              <button class="trend-btn" data-mode="week">按周</button>
              <button class="trend-btn" data-mode="month">按月</button>
              <button class="trend-btn" data-mode="churn">代码流失</button>
            </div>
            <div id="trend-chart"></div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
