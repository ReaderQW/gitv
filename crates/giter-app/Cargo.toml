[package]
name = "giter-app"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Desktop application for giter - a git repository analysis tool"

[lib]
name = "giter_app_lib"
path = "src/lib.rs"

[[bin]]
name = "giter-app"
path = "src/main.rs"

[dependencies]
tauri = { version = "2", features = [] }
giter-core = { path = "../giter-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.14"
chrono = "0.4"

[package.metadata]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tempfile = "3.8"
